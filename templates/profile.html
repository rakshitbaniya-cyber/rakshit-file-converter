<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Rakshit File Converter</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
        }

        header {
            background: #14213d;
            color: white;
            padding: 22px;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .account {
            background: #f3f6fb;
            padding: 18px;
            border-radius: 8px;
            margin: 20px 0;
        }

        a.button {
            display: inline-block;
            padding: 12px 20px;
            background: #2457d6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin: 8px 5px 8px 0;
        }

        a.back { color: #2457d6; }
    </style>
</head>

<body>

<header>
    <h1>Rakshit File Converter</h1>
    <p>My Account</p>
</header>

<main>
    <h2>My Profile</h2>

    <div class="account">
        <h3>Account Information</h3>
        <p><strong>Email:</strong> {{ current_user }}</p>
        <p><strong>Account Status:</strong> Registered</p>
    </div>

    <a class="button" href="/logout">Logout</a>
    <a class="button" href="/settings">Settings</a>

    <p><a class="back" href="/">← Back to Home</a></p>
</main>

</body>
</html>
