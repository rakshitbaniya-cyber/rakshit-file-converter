<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tool[0] }} - Rakshit File Converter</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
        }
        header {
            background: #14213d;
            color: white;
            padding: 22px;
            text-align: center;
        }
        main {
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }
        input, button {
            padding: 12px;
            margin-top: 15px;
            width: 100%;
        }
        button {
            background: #2457d6;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        a { color: #2457d6; }
    </style>
</head>
<body>
<header>
    <h1>Rakshit File Converter</h1>
</header>

<main>
    <h2>{{ tool[0] }}</h2>
    <p>{{ tool[2] }}</p>

    <form action="/convert/{{ tool[1] }}" method="POST"
          enctype="multipart/form-data">
        <label>Select your file:</label>
        <input type="file" name="file" required>
        <button type="submit">Convert File</button>
    </form>

    <p><a href="/">← Back to Home</a></p>
</main>
</body>
</html>
